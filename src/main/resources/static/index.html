<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SkinCare Agent</title><link rel="stylesheet" href="/css/app.css"></head><body>
<div class="app" data-theme="vintage">
<aside id="sidebar"><div class="brand">SkinCare Agent<small>Personal skincare journal</small></div><button class="new" id="new">＋ 新对话</button><div class="nav-title">界面风格</div><div class="switch" aria-label="切换设计版本"><button data-set="vintage" aria-pressed="true">01 复古卷轴</button><button data-set="rose" aria-pressed="false">02 玫瑰手帐</button><button data-set="pearl" aria-pressed="false">03 珍珠留白</button></div><div class="nav-title">常用入口</div><nav class="history" id="history"></nav><div class="nav-title">当前用户</div><label class="user-label" for="user-id">演示用户 ID</label><input id="user-id" value="demo-user" maxlength="64" autocomplete="off"><p class="sidebar-status" id="session-status"></p><button class="profile" id="profile" aria-label="编辑肤质档案"><i class="mirror-sparkle" aria-hidden="true" style="--x:19%;--y:28%;--size:16px;--duration:4.8s;--delay:-1.3s"></i><i class="mirror-sparkle" aria-hidden="true" style="--x:65%;--y:17%;--size:13px;--duration:5.6s;--delay:-3.2s"></i><i class="mirror-sparkle" aria-hidden="true" style="--x:82%;--y:46%;--size:18px;--duration:6.2s;--delay:-.8s"></i><i class="mirror-sparkle" aria-hidden="true" style="--x:29%;--y:78%;--size:15px;--duration:5.2s;--delay:-3.5s"></i><i class="mirror-sparkle" aria-hidden="true" style="--x:63%;--y:85%;--size:12px;--duration:6.8s;--delay:-4.9s"></i><span><strong>我的肤质档案</strong><small id="skin-summary">点击填写肤质</small></span></button></aside>
<main><header><div><strong>护肤对话</strong><span class="header-note">SkinCare Studio</span></div><button class="replay" id="replay">↻ 卷轴</button></header>
<div class="stage"><div class="thinking" id="thinking" role="status" aria-live="polite" hidden><div class="tea-card"><div class="tea-scene" aria-hidden="true"><img id="tea-frame" src="/assets/serum-24/frame_01.webp" width="840" height="473" alt="" decoding="sync"></div><p class="tea-caption" id="tea-caption">正在提取护肤灵感，整理思路…</p></div></div><div class="feed" id="feed"><section class="welcome" id="welcome"><img class="stamp" id="stamp" src="/assets/stamp-vintage.webp" alt=""><div class="eyebrow" id="edition">Edition 01 · Vintage</div><h1 id="headline">今天想聊点什么护肤问题？</h1><p id="description">从一份成分表、一个产品，或你的日常护肤步骤开始。</p><div class="prompts" id="prompts"></div></section><div class="messages" id="messages" aria-live="polite" hidden></div></div>
<details class="context-panel" id="context-panel"><summary>产品成分与提问背景（可选）</summary><div class="context-grid"><label>产品 A 名称<input id="product-a-name" placeholder="例如 面霜 A"></label><label>产品 A 成分表<textarea id="product-a" rows="3" placeholder="粘贴包装上的完整成分表"></textarea></label><label>产品 B 名称<input id="product-b-name" placeholder="可选，用于对比"></label><label>产品 B 成分表<textarea id="product-b" rows="3" placeholder="可选"></textarea></label><label>关注问题<input id="concern" placeholder="例如 保湿、泛红"></label><label>使用部位<input id="body-area" placeholder="例如 面部"></label><label>当前状态<input id="current-state" placeholder="例如 正在泛红"></label><label>敏感情况<select id="sensitive"><option value="">未说明</option><option value="yes">自述敏感</option><option value="no">不敏感</option></select></label><label>已确认过敏成分（逗号分隔）<input id="ingredient-allergies" placeholder="例如 苯氧乙醇"></label><label class="check"><input id="allergies-confirmed" type="checkbox">以上过敏成分由我确认</label><label class="check"><input id="ingredients-confirmed" type="checkbox">已核对包装上的完整成分表</label></div><div class="context-tools"><label>产品网页链接<input id="product-url" type="url" placeholder="可选：粘贴产品页地址"></label><label>市场<input id="product-market" placeholder="例如 中国"></label><label>产品版本<input id="product-version" placeholder="例如 2026 版"></label><button type="button" id="extract-web">从网页提取候选成分</button><button type="button" id="load-saved">载入已保存成分表</button><p id="tool-status" role="status"></p><div id="saved-list"></div><form id="knowledge-form"><label>知识库片段检索<input id="knowledge-query" placeholder="例如 烟酰胺与泛红"></label><button>检索</button></form><div id="knowledge-results"></div></div></details><form class="composer" id="composer"><input id="prompt" aria-label="护肤问题" placeholder="问问护肤成分、产品或护肤步骤…" autocomplete="off" required><button class="send">发送 ↑</button></form><div class="caption">回答来自真实服务；资料不足时请继续追问</div></div></main>
<dialog id="dialog"><form id="profile-form"><h2>我的肤质档案</h2><label>已确认肤质<input name="skin" maxlength="30" placeholder="例如 混合偏干"></label><label>已确认过敏原<input name="allergens" maxlength="200" placeholder="用逗号分隔；不确定的不要填"></label><label class="check"><input name="confirmed" type="checkbox" required>我确认以上资料</label><p id="profile-status" role="status"></p><footer><button type="button" id="close">取消</button><button class="primary">保存</button></footer></form></dialog>
<div class="opening" id="opening" hidden><div class="roll" aria-label="卷轴展开"><div class="leaf"></div><div class="rod top"></div><div class="rod bottom"></div><b>SkinCare Agent</b></div><button id="skip">跳过开场</button></div>
</div>
<script type="module" src="/js/main.js"></script></body></html>
