<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkinCare Copilot · Day 4</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #263238; }
    #messages { min-height: 280px; border: 1px solid #ddd; padding: 1rem; border-radius: 8px; }
    .message { margin: .7rem 0; white-space: pre-wrap; }
    .user { color: #126ca5; }
    .error { color: #b42318; }
    form { display: flex; gap: .5rem; margin-top: 1rem; }
    input { flex: 1; padding: .7rem; }
    button { padding: .7rem 1rem; }
    label { display: block; margin: .6rem 0; }
    #profile-status { white-space: pre-wrap; }
    .knowledge-hit { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin: 1rem 0; }
    .knowledge-hit p, .knowledge-hit blockquote { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>SkinCare Copilot</h1>
  <p>Day 6：聊天会按问题类型处理；事实问题使用已核实资料，并展示检索来源。餐食方案仍未开放。请勿输入真实病历。</p>
  <section aria-labelledby="knowledge-title">
    <h2 id="knowledge-title">知识片段与来源</h2>
    <p>这里展示资料片段及人工译文，不生成综合回答。相似度用于排序，不代表医学证据等级。</p>
    <p id="knowledge-status" aria-live="polite">正在读取知识目录……</p>
    <details>
      <summary>查看已导入来源</summary>
      <ul id="knowledge-sources"></ul>
    </details>
    <form id="knowledge-form">
      <input id="knowledge-query" aria-label="知识检索" maxlength="500" required placeholder="例如：痤疮皮肤如何清洁？">
      <button id="knowledge-search" type="submit">检索片段</button>
    </form>
    <div id="knowledge-results" aria-live="polite"></div>
  </section>
  <section aria-labelledby="product-title">
    <h2 id="product-title">具体产品的官方页面查询</h2>
    <p>输入完整产品名；品牌名不足以确定配方。搜索摘要仅用于定位官网页面，不能诊断致敏成分。若官网未列完整成分表，请勿据此判断。</p>
    <form id="product-form">
      <input id="product-name" aria-label="具体产品全名" maxlength="120" required placeholder="输入包装上的完整产品名">
      <button id="product-search" type="submit">查找官网页面</button>
    </form>
    <div id="product-results" aria-live="polite"></div>
  </section>
  <section>
    <h2>演示用户画像</h2>
    <label>用户 ID <input id="user-id" value="demo-user" maxlength="40"></label>
    <label>已确认肤质 <input id="skin-type" placeholder="例如：油性"></label>
    <label>已确认过敏原（逗号分隔） <input id="allergens" placeholder="例如：花生, 牛奶"></label>
    <label><input id="confirmed" type="checkbox"> 我确认以上是虚构用户主动提供的信息</label>
    <button id="save-profile" type="button">保存画像</button>
    <button id="load-profile" type="button">查询画像</button>
    <p id="profile-status" aria-live="polite"></p>
  </section>
  <h2>当前会话聊天</h2>
  <p>会话 ID：<span id="session-id"></span> <button id="new-session" type="button">开始新会话</button></p>
  <div id="messages" aria-live="polite"></div>
  <form id="chat-form">
    <input id="message" aria-label="消息" maxlength="2000" required placeholder="输入一条消息">
    <button id="send" type="submit">发送</button>
  </form>
  <script>
    document.querySelector('#product-form').addEventListener('submit', async event => {
      event.preventDefault();
      const result = document.querySelector('#product-results');
      result.replaceChildren();
      try {
        const response = await fetch('/api/products/search', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({productName: document.querySelector('#product-name').value.trim()})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '搜索失败');
        const note = document.createElement('p');
        note.textContent = data.note;
        result.append(note);
        for (const page of data.officialPageCandidates) {
          const item = document.createElement('p');
          const link = document.createElement('a');
          const url = new URL(page.url);
          if (url.protocol !== 'https:') continue;
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = page.title;
          item.append(link, document.createTextNode(`：${page.searchSnippet}`));
          result.append(item);
        }
      } catch (error) {
        result.textContent = error.message || '搜索失败。';
      }
    });
    const knowledgeStatus = document.querySelector('#knowledge-status');
    const knowledgeResults = document.querySelector('#knowledge-results');
    const knowledgeSearch = document.querySelector('#knowledge-search');
    function sourceLink(source) {
      const link = document.createElement('a');
      link.textContent = `${source.publisher} · ${source.title} · ${source.section}`;
      const url = new URL(source.url);
      if (url.protocol === 'https:' && ['www.aad.org', 'www.nice.org.uk'].includes(url.hostname)) {
        link.href = url.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      }
      return link;
    }
    async function loadKnowledgeSources() {
      try {
        const response = await fetch('/api/knowledge/sources');
        if (!response.ok) throw new Error('catalog');
        const catalog = await response.json();
        knowledgeStatus.textContent = catalog.entryCount
          ? `已导入 ${catalog.entryCount} 条知识，切分为 ${catalog.chunkCount} 个片段；使用本地中文 Embedding。`
          : '尚无已核实的知识条目。待核实 AAD/NICE 官网原文后导入，当前不会展示未核实内容。';
        const list = document.querySelector('#knowledge-sources');
        list.replaceChildren();
        for (const source of catalog.entries) {
          const item = document.createElement('li');
          item.append(sourceLink(source), document.createTextNode(`（核实于 ${source.verifiedOn}）`));
          list.append(item);
        }
      } catch (error) {
        knowledgeStatus.textContent = '知识目录读取失败，请检查后端是否运行。';
      }
    }
    loadKnowledgeSources();
    document.querySelector('#knowledge-form').addEventListener('submit', async event => {
      event.preventDefault();
      const query = document.querySelector('#knowledge-query').value.trim();
      if (!query) return;
      knowledgeSearch.disabled = true;
      knowledgeResults.replaceChildren();
      try {
        const response = await fetch('/api/knowledge/search', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({query, topK: 3})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '检索失败');
        if (!data.matches.length) {
          knowledgeResults.textContent = '未找到达到相似度阈值的片段，或知识库尚未导入内容。';
        }
        for (const hit of data.matches) {
          const card = document.createElement('article');
          card.className = 'knowledge-hit';
          const excerpt = document.createElement('p');
          excerpt.textContent = `人工译文片段：${hit.chunk.text}`;
          const metadata = document.createElement('p');
          metadata.textContent = `片段 ${hit.chunk.id} · 相似度 ${hit.score.toFixed(3)} · 核实于 ${hit.chunk.source.verifiedOn}`;
          const original = document.createElement('blockquote');
          original.textContent = `对应条目原文：${hit.chunk.source.originalExcerpt}`;
          card.append(sourceLink(hit.chunk.source), metadata, excerpt, original);
          knowledgeResults.append(card);
        }
      } catch (error) {
        knowledgeResults.textContent = error.message || '检索失败，请稍后重试。';
      } finally {
        knowledgeSearch.disabled = false;
      }
    });
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const send = document.querySelector('#send');
    const userId = document.querySelector('#user-id');
    const sessionLabel = document.querySelector('#session-id');
    let sessionId = sessionStorage.getItem('skincare-session-id') || crypto.randomUUID();
    sessionStorage.setItem('skincare-session-id', sessionId);
    sessionLabel.textContent = sessionId;
    document.querySelector('#new-session').addEventListener('click', () => {
      sessionId = crypto.randomUUID();
      sessionStorage.setItem('skincare-session-id', sessionId);
      sessionLabel.textContent = sessionId;
      messages.replaceChildren();
    });
    const profileStatus = document.querySelector('#profile-status');
    const profileUrl = () => `/api/profiles/${encodeURIComponent(userId.value.trim())}`;
    document.querySelector('#save-profile').addEventListener('click', async () => {
      const allergens = document.querySelector('#allergens').value.split(',').map(item => item.trim()).filter(Boolean);
      try {
        const response = await fetch(profileUrl(), {
          method: 'PUT', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({skinType: document.querySelector('#skin-type').value,
            allergens, confirmed: document.querySelector('#confirmed').checked})
        });
        const data = await response.json();
        profileStatus.textContent = response.ok ? `已保存：${data.skinType}；过敏原：${data.allergens.join('、') || '未登记'}`
          : `保存失败：${data.error || response.status}`;
      } catch (error) {
        profileStatus.textContent = '请求失败，请检查后端是否运行。';
      }
    });
    document.querySelector('#load-profile').addEventListener('click', async () => {
      try {
        const response = await fetch(profileUrl());
        if (response.status === 404) {
          profileStatus.textContent = '该用户尚无确认画像。';
          return;
        }
        const data = await response.json();
        profileStatus.textContent = response.ok ? `已确认肤质：${data.skinType}；过敏原：${data.allergens.join('、') || '未登记'}`
          : `查询失败：${data.error || response.status}`;
      } catch (error) {
        profileStatus.textContent = '请求失败，请检查后端是否运行。';
      }
    });
    function append(role, content, className = '') {
      const line = document.createElement('div');
      line.className = `message ${className}`;
      line.textContent = `${role}：${content}`; // 文本渲染，避免把模型输出当 HTML 执行。
      messages.append(line);
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      append('我', message, 'user');
      input.value = '';
      send.disabled = true;
      try {
        const response = await fetch('/api/chat', {
          method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({userId: userId.value.trim(), sessionId, message})
        });
        const data = await response.json();
        append(response.ok ? '助手' : '错误', data.answer, response.ok ? '' : 'error');
        if (response.ok && data.route) append('路由', data.route);
        if (response.ok && data.sources?.length) {
          const list = document.createElement('ul');
          for (const source of data.sources) {
            const item = document.createElement('li');
            item.append(sourceLink(source), document.createTextNode(`（核实于 ${source.verifiedOn}）`));
            list.append(item);
          }
          messages.append(list);
        }
      } catch (error) {
        append('错误', '请求失败，请检查后端是否运行。', 'error');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
